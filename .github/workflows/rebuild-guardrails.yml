name: Foundation quality

# `main` requires these jobs on every pull request (repository ruleset), and PRs squash-merge
# once they pass, so a second run on the merged commit would repeat the same checks.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-guardrails-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD^ is the whitespace check's fallback base.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check changed-line whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            diff_base="${{ github.event.pull_request.base.sha }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            diff_base="$(git rev-parse HEAD^)"
          else
            diff_base="$(git hash-object -t tree /dev/null)"
          fi

          # The shallow checkout may not contain the base (an older PR base or
          # a multi-commit push); fetch just that commit.
          if ! git cat-file -e "$diff_base"; then
            git fetch --no-tags --depth=1 origin "$diff_base"
          fi

          git diff --check "$diff_base" HEAD

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Specs share one fixture server, so an in-process Playwright retry would
      # start from the failed attempt's leftover state. Instead, rerun only the
      # failed specs once against a fresh server and database.
      - name: Run browser tests
        id: browser-tests
        continue-on-error: true
        run: npm run test:e2e
      # The rerun clears test-results/, so keep the first run's traces and
      # screenshots: a spec that passes on the rerun may still have failed
      # because an earlier spec left state behind.
      - name: Keep the first run's failure artifacts
        if: steps.browser-tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-first-run
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Rerun failed browser tests once
        if: steps.browser-tests.outcome == 'failure'
        run: |
          echo "::warning::Browser tests failed; rerunning only the failed specs once. The first run's output is in the e2e-first-run artifact."
          npm run test:e2e -- --last-failed

  production-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: this job never runs npm ci, so it would save a
      # near-empty ~/.npm under the key the other jobs share.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build and verify the disposable production container
        shell: bash
        run: bash scripts/check-production-container.sh
